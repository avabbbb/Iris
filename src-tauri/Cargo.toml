[package]
name = "iris"
version = "0.1.0"
description = "Iris - AI creative layer for professional editing tools"
authors = ["Iris"]
edition = "2021"
default-run = "iris"

[lib]
name = "iris_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "iris"
path = "src/main.rs"

[[bin]]
name = "iris-host"
path = "src/bin/host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11"
uuid = { version = "1.24", features = ["serde", "v7"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
once_cell = "1"
tiny_http = "0.12"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
hex = "0.4"
base64 = "0.22"
jsonschema = { version = "0.48", default-features = false }
getrandom = "0.4"
subtle = "2.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
