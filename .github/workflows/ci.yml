name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-runtime:
    name: Web, extension, DSH, Rust
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        if: github.event_name != 'pull_request'
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Install DSH plugin dependencies
        run: npm --prefix dsh-plugin ci

      - name: Audit DSH plugin dependencies
        if: github.event_name != 'pull_request'
        run: npm audit --prefix dsh-plugin --audit-level=moderate

      - name: Docs contract
        run: npm run docs:check

      - name: Portability guard (paths, CRLF, POSIX file modes)
        run: npm run guard:portability

      - name: Module name case-collision guard
        run: npm run guard:module-case

      - name: Verify release versions
        if: github.event_name != 'pull_request'
        run: npm run version:check

      - name: Release red-team invariants
        if: github.event_name != 'pull_request'
        run: npm run release:red-team

      - name: Tracked secret audit
        run: npm run release:secret-audit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm test -- --reporter=dot

      - name: Web build
        run: npm run build

      - name: Browser extension build
        run: npm run ext:build

      - name: DSH plugin build
        if: github.event_name != 'pull_request'
        run: npm --prefix dsh-plugin run build

      - name: Build Tauri agent sidecar fixture
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          node scripts/build-agent-sidecar.mjs --target x86_64-pc-windows-msvc
          $agent = 'src-tauri/binaries/iris-agent-x86_64-pc-windows-msvc.exe'
          if (-not (Test-Path -LiteralPath $agent -PathType Leaf)) {
            throw "Agent sidecar was not produced: $agent"
          }
          if ((Get-Item -LiteralPath $agent).Length -le 0) {
            throw "Agent sidecar is empty: $agent"
          }

      - name: Rust tests
        if: github.event_name != 'pull_request'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Git diff check
        run: git diff --check

  critical-stability:
    name: Critical suite 10x
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install DSH plugin dependencies
        run: npm --prefix dsh-plugin ci

      - name: Audit DSH plugin dependencies
        run: npm audit --prefix dsh-plugin --audit-level=moderate

      - name: Critical suite repeated ten times
        run: npm run test:critical
