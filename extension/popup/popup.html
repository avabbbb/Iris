<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>Iris</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- 视觉对齐 docs/design/DESIGN.md：暖纸面、单一薄荷、扁平卡片、12px 紧凑密度、奶蛙品牌。 -->
  <main class="pop">
    <header class="pop__head">
      <img class="pop__logo" src="../icons/icon48.png" alt="" width="28" height="28" />
      <div class="pop__brand">
        <strong>Iris</strong>
        <span id="extensionVersion" class="pop__version"></span>
      </div>
      <button id="openSettings" type="button" class="icon-btn" data-icon="settings" data-i18n-title="settings"></button>
      <button id="openIris" type="button" class="isl-go" data-i18n="open_iris">打开 Iris</button>
    </header>

    <!-- 状态岛（灵感：Inspora「dynamic release island」）：空闲是胶囊，导入 / 反推时展开出步骤与两段进度，完成后薄荷扫光再收回。 -->
    <section id="island" class="island" data-mode="pill" data-tone="idle" aria-live="polite">
      <span class="island__sweep" aria-hidden="true"></span>
      <div class="island__head">
        <span id="statusIcon" class="status__icon" data-state="idle" aria-hidden="true"></span>
        <div class="island__text">
          <strong id="statusTitle" data-i18n="island_idle_title">等待连接</strong>
          <span id="statusMessage" data-i18n="island_idle_hint">右键图片即可送进 Iris</span>
        </div>
        <span id="islandPercent" class="island__percent" hidden></span>
        <button id="islandDismiss" type="button" class="icon-btn icon-btn--sm island__close" data-icon="close" data-i18n-title="island_dismiss" hidden></button>
      </div>
      <div class="island__body">
        <div class="island__inner">
          <div id="islandFilm" class="film" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
          <ol id="islandSteps" class="steps"></ol>
          <p id="islandError" class="island__error" hidden></p>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="card__label" data-i18n="section_connections">连接</h2>
      <ul id="webPairingList" class="conn"></ul>
      <div class="conn__row is-wrap">
        <span class="conn__glyph" data-icon="desktop" aria-hidden="true"></span>
        <div class="conn__text">
          <strong data-i18n="desktop_label">Iris Desktop</strong>
          <small id="desktopState" data-i18n="desktop_idle">未连接</small>
        </div>
        <button id="connectDesktop" type="button" class="isl-chip" data-i18n="desktop_connect">连接</button>
      </div>
    </section>

    <section id="receipt" class="card" hidden>
      <div class="receipt">
        <span class="conn__glyph is-done" data-icon="check" aria-hidden="true"></span>
        <div class="conn__text">
          <strong id="receiptName"></strong>
          <small id="receiptDestination"></small>
        </div>
      </div>
    </section>

    <section id="reverse" class="card" hidden>
      <h2 class="card__label" data-i18n="section_reverse">最近一次反推</h2>
      <p id="reversePrompt" class="reverse__text"></p>
      <div class="reverse__foot">
        <small id="reverseMeta" class="reverse__meta"></small>
        <button id="copyReverse" type="button" class="isl-chip" data-i18n="copy">复制</button>
        <button id="sendReverse" type="button" class="isl-chip isl-chip--mint" data-i18n="send_to_canvas">送进画布</button>
      </div>
    </section>

    <section id="star" class="card star" hidden>
      <div class="star__row">
        <span class="conn__glyph is-star" data-icon="star" aria-hidden="true"></span>
        <div class="conn__text">
          <strong data-i18n="star_title">喜欢 Iris？</strong>
          <small class="star__body" data-i18n="star_body">去 GitHub 点个 Star，帮更多人发现它。</small>
        </div>
        <div class="conn__actions">
          <button id="starOpen" type="button" class="isl-chip isl-chip--mint" data-i18n="star_action">点 Star</button>
          <button id="starClose" type="button" class="icon-btn icon-btn--sm" data-icon="close" data-i18n-title="star_close"></button>
        </div>
      </div>
    </section>

    <section id="history" class="card" hidden>
      <div class="card__head">
        <h2 class="card__label" data-i18n="section_history">最近导入</h2>
        <button id="clearHistory" type="button" class="link-btn" data-i18n="clear">清空</button>
      </div>
      <ul id="historyList" class="history"></ul>
    </section>

    <section id="empty" class="empty">
      <strong data-i18n="empty_title">还没有导入过</strong>
      <span data-i18n="empty_body">右键网页上的图片：送进画布、送进 Desktop，或反推提示词。</span>
    </section>

    <footer class="pop__foot">
      <span class="conn__glyph is-small" data-icon="lock" aria-hidden="true"></span>
      <span data-i18n="privacy">只传你明确选中的媒体，不扫描整页。</span>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
